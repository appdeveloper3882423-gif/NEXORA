
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>NEXORA — One Platform. Every Profession.</title>
<meta name="description" content="NEXORA business workspace for teams, education, attendance, tasks and business operations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b16;--panel:#101629;--panel2:#111d30;--line:#202b43;--text:#eef3ff;--muted:#8c9ab5;--blue:#5794ff;--purple:#a47aff;--cyan:#45d6e8;--green:#39d6a2;--red:#ff6b82;--amber:#ffca70;--radius:18px;--shadow:0 18px 55px #0004}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 450px at 70% -10%,#1a2b50 0%,transparent 65%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:.5px}.brand span{color:var(--blue)}.btn{border:1px solid var(--line);border-radius:12px;background:#172139;color:var(--text);padding:10px 14px;font-weight:700;transition:.18s}.btn:hover{filter:brightness(1.14);transform:translateY(-1px)}.btn.primary{background:linear-gradient(120deg,#397cf4,#7458ee);border:0}.btn.ghost{background:transparent}.btn.danger{color:#ff9cac;border-color:#663244;background:#2a1725}.btn.good{background:#12392f;border-color:#235e50;color:#7af0c4}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;color:#aebbd3;font-weight:700}.field input,.field select,.field textarea,.searchbox{width:100%;border:1px solid #293653;background:#0b1222;color:var(--text);border-radius:11px;padding:12px 13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #5794ff20}.field textarea{min-height:90px;resize:vertical}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,470px);padding:30px;border:1px solid #263451;background:linear-gradient(145deg,#121a2d,#0d1322);border-radius:24px;box-shadow:var(--shadow)}.auth-logo{font-size:26px;margin-bottom:6px}.auth-card h1{font:800 27px Manrope;margin:24px 0 8px}.auth-card p{color:var(--muted);line-height:1.6}.auth-switch{display:flex;gap:8px;margin:18px 0}.auth-switch button{flex:1}.auth-msg{padding:11px 12px;border-radius:10px;background:#18243b;color:#c8d8f6;font-size:13px;margin:12px 0}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#0a1020ef;padding:22px 14px;display:flex;flex-direction:column;gap:22px;overflow:auto}.side-head{padding:0 10px}.side-head .brand{font-size:23px}.tagline{font-size:10px;letter-spacing:1.3px;color:#7788a7;margin-top:4px}.nav-group{display:grid;gap:5px}.nav-label{padding:0 12px 7px;font-size:10px;letter-spacing:1.6px;color:#657696;font-weight:800}.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;color:#9aa9c5;text-align:left;padding:11px 12px;border-radius:11px;font-size:13px;font-weight:700}.nav-item:hover,.nav-item.active{background:linear-gradient(100deg,#1a2b4b,#151c35);border-color:#263b60;color:#fff}.nav-item.active .nav-ico{color:var(--blue)}.nav-ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;display:grid;gap:12px;padding:0 8px}.user-chip{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:#10182a}.avatar{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-weight:800}.user-name{font-size:12px;font-weight:800;max-width:130px;overflow:hidden;text-overflow:ellipsis}.user-email{font-size:10px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis}.main{min-width:0}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 30px;border-bottom:1px solid #202b433f;background:#080b16a8;backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.top-left{display:flex;align-items:center;gap:14px;min-width:0}.page-title{font:800 19px Manrope}.crumb{font-size:11px;color:var(--muted);margin-top:3px}.top-actions{display:flex;gap:9px;align-items:center}.searchbox{width:min(260px,28vw);padding:10px 12px}.content{padding:28px 30px 50px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:800;text-transform:uppercase}.welcome h1{font:800 clamp(24px,3vw,33px) Manrope;margin:8px 0}.welcome p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:linear-gradient(145deg,#111a2d,#0e1525);border:1px solid #202e49;border-radius:var(--radius);box-shadow:0 8px 25px #0001}.stat{padding:19px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--glow,#5794ff);filter:blur(55px);opacity:.18;right:-20px;top:-35px}.stat-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.stat-label{font-size:12px;color:#a5b2ca;font-weight:600}.stat-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#1b2b48;color:var(--blue)}.stat-value{font:800 26px Manrope;margin:18px 0 7px;position:relative;z-index:1}.stat-foot{font-size:11px;color:var(--muted);position:relative;z-index:1}.two-col{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr)}.panel{padding:21px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel-title{font:800 14px Manrope}.panel-sub{font-size:11px;color:var(--muted);margin-top:5px}.chart{height:220px;display:flex;align-items:flex-end;gap:12px;padding:10px 3px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 49px,#26314a55 50px)}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:9px;min-width:0}.bar{width:min(32px,80%);min-height:3px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#7a89ff,#3f7ef5);box-shadow:0 0 18px #5794ff22}.bar-label{font-size:10px;color:#7f90ae;padding-bottom:9px}.legend{display:flex;gap:15px;margin-top:15px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7f90ae;padding:12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #202b435c;font-size:12px;color:#dce5f7}tbody tr:hover{background:#ffffff04}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800;background:#1a2a43;color:#9fc0ff}.status.good{background:#10382f;color:#6be8bb}.status.warn{background:#3a2c19;color:#ffd17f}.status.bad{background:#3a1d2a;color:#ff9ab0}.table-actions{display:flex;gap:5px}.icon-btn{border:1px solid var(--line);background:#121c30;color:#aabbd8;border-radius:8px;padding:6px 8px}.empty{text-align:center;padding:32px 12px;color:var(--muted);font-size:12px}.list{display:grid;gap:10px}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid #202c44;border-radius:12px;background:#0d1526}.list-main{min-width:0}.list-name{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis}.list-meta{font-size:10px;color:var(--muted);margin-top:5px}.amount{font-weight:800;font-size:12px;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}.page-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbar-left,.toolbar-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#10182a;color:#dce5f7;border-radius:10px;padding:10px 12px}.modal-backdrop{position:fixed;inset:0;background:#030611c9;backdrop-filter:blur(8px);z-index:40;display:grid;place-items:center;padding:18px}.modal{width:min(100%,620px);max-height:90vh;overflow:auto;border:1px solid #30415f;border-radius:20px;background:#10182a;box-shadow:var(--shadow)}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{font:800 17px Manrope;margin:0}.modal-body{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span-2{grid-column:1/-1}.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;bottom:22px;right:22px;z-index:60;padding:13px 16px;background:#16243c;border:1px solid #3a527a;border-radius:12px;box-shadow:var(--shadow);font-size:12px;max-width:min(380px,90vw)}.toast.error{border-color:#7a3449}.workspace-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#111a2d;color:#dce5f7;border-radius:10px;padding:9px 11px;font-size:11px}.mobile-menu{display:none}.section-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.feature-card{padding:17px;border:1px solid var(--line);border-radius:14px;background:#0c1424}.feature-card h3{font:700 13px Manrope;margin:12px 0 6px}.feature-card p{font-size:11px;color:var(--muted);line-height:1.6;margin:0}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.notice{border:1px solid #31405d;background:#111d32;border-radius:12px;padding:13px;color:#b8c9e7;font-size:12px;line-height:1.6}.toggle{accent-color:var(--blue)}.footer-note{font-size:10px;color:#687996;text-align:center;padding:20px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.section-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;left:-280px;top:0;width:250px;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 15px;height:70px}.content{padding:20px 14px 40px}.searchbox{display:none}.top-actions .btn-label{display:none}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:22px}.panel{padding:15px}.section-grid,.settings-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.top-actions{gap:6px}.page-title{font-size:16px}.crumb{display:none}}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-label{font-size:10px}.stat-value{font-size:19px}.top-actions .workspace-pill{max-width:105px;overflow:hidden}.auth-card{padding:22px}.modal-backdrop{padding:8px}.modal-body{padding:15px}.modal-head{padding:16px}.modal-foot{padding:12px}.chart{gap:5px}.bar-label{font-size:9px}}
@media(min-width:761px) and (max-width:1000px){.app{grid-template-columns:220px minmax(0,1fr)}.content{padding:22px 18px}.topbar{padding:0 18px}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="authView" class="auth-wrap">
  <section class="auth-card">
    <div class="brand auth-logo">NEX<span>ORA</span></div>
    <div class="tagline">ONE PLATFORM. EVERY PROFESSION.</div>
    <h1 id="authHeading">Welcome back</h1>
    <p id="authDescription">Sign in to manage your business from one command center.</p>
    <div class="auth-switch"><button class="btn primary" id="showLogin">Sign In</button><button class="btn" id="showRegister">Create Account</button></div>
    <form id="authForm">
      <div class="field hidden" id="nameField"><label>FULL NAME</label><input id="authName" autocomplete="name" placeholder="Your full name"></div>
      <div class="field"><label>EMAIL ADDRESS</label><input id="authEmail" type="email" required autocomplete="email" placeholder="you@company.com"></div>
      <div class="field"><label>PASSWORD</label><input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></div>
      <button class="btn primary" id="authSubmit" type="submit" style="width:100%;padding:13px">Sign In</button>
    </form>
    <button class="btn ghost" id="forgotPassword" style="width:100%;margin-top:8px">Forgot password?</button>
    <button class="btn" id="googleSignInBtn" type="button" style="width:100%;margin-top:8px">
  <strong>G</strong> &nbsp; Continue with Google
</button>
    <div id="authMessage" class="auth-msg hidden"></div>
    <div class="footer-note">Secure account-based workspace · Your data belongs to your account</div>
  </section>
</div>
<div id="appView" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-head"><div class="brand">NEX<span>ORA</span></div><div class="tagline">ONE PLATFORM. EVERY PROFESSION.</div></div>
    <div>
      <div class="nav-label">WORKSPACE</div>
      <div class="nav-group" id="mainNav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-ico">◈</span>Command Center</button>
        <button class="nav-item" data-page="transactions"><span class="nav-ico">↔</span>Transactions</button>
        <button class="nav-item" data-page="customers"><span class="nav-ico">♙</span>Customers & Leads</button>
        <button class="nav-item" data-page="suppliers"><span class="nav-ico">♧</span>Suppliers</button>
        <button class="nav-item" data-page="inventory"><span class="nav-ico">▦</span>Inventory</button>
        <button class="nav-item" data-page="projects"><span class="nav-ico">◷</span>Projects & Tasks</button>
        <button class="nav-item" data-page="invoices"><span class="nav-ico">▤</span>Invoices & Quotes</button>
        <button class="nav-item" data-page="bills"><span class="nav-ico">▧</span>Bills & Purchases</button>
        <button class="nav-item" data-page="appointments"><span class="nav-ico">▣</span>Appointments</button>
        <button class="nav-item" data-page="branches"><span class="nav-ico">⌂</span>Branches</button>
        <button class="nav-item" data-page="reports"><span class="nav-ico">▥</span>Reports & Data</button>
      </div>
    </div>
    <div>
      <div class="nav-label">CONFIGURATION</div>
      <div class="nav-group">
        <button class="nav-item" data-page="workspaces"><span class="nav-ico">▣</span>Business Workspaces</button>
        <button class="nav-item" data-page="settings"><span class="nav-ico">⚙</span>Business Settings</button>
      </div>
    </div>
    <div class="side-bottom">
      <div class="user-chip"><div class="avatar" id="userAvatar">N</div><div style="min-width:0"><div id="userName" class="user-name">NEXORA User</div><div id="userEmail" class="user-email"></div></div></div>
      <button class="btn ghost" id="signOutBtn">↪ Sign Out</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button class="btn mobile-menu" id="menuToggle">☰</button><div><div class="page-title" id="topTitle">Command Center</div><div class="crumb" id="topCrumb">Your business at a glance</div></div></div>
      <div class="top-actions"><input id="globalSearch" class="searchbox" placeholder="Search current module…"><select id="workspaceSelect" class="workspace-pill" aria-label="Workspace"></select><button class="btn" id="quickAddBtn">＋ <span class="btn-label">Quick Add</span></button></div>
    </header>
    <div id="pageContent" class="content"></div>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
