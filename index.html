```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d19">
  <title>NEXORA — Business Workspace</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="authScreen" class="auth-wrap">
    <section class="auth-card">
      <div class="brand-mark">N</div>
      <p class="eyebrow">YOUR BUSINESS WORKSPACE</p>
      <h1>NEXORA</h1>
      <p class="muted">One platform. Every profession.</p>

      <div class="field">
        <label for="authName">Full name (for registration)</label>
        <input id="authName" placeholder="Your name" autocomplete="name">
      </div>
      <div class="field">
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" placeholder="At least 6 characters" autocomplete="current-password">
      </div>
      <div class="field">
        <label for="authBusiness">Business category</label>
        <select id="authBusiness">
          <option value="general">General Business</option>
          <option value="retail">Retail / Shop</option>
          <option value="restaurant">Restaurant</option>
          <option value="services">Services / Freelancer</option>
          <option value="healthcare">Healthcare</option>
          <option value="education">Education</option>
          <option value="construction">Construction</option>
          <option value="manufacturing">Manufacturing</option>
          <option value="realestate">Real Estate</option>
          <option value="transport">Transport / Logistics</option>
          <option value="agriculture">Agriculture</option>
          <option value="custom">Custom Category</option>
        </select>
      </div>
      <div class="field hidden" id="customCategoryField">
        <label for="authCustomCategory">Your category</label>
        <input id="authCustomCategory" placeholder="Enter business category">
      </div>

      <div class="button-row">
        <button id="loginBtn" class="btn primary">Sign in</button>
        <button id="registerBtn" class="btn">Create account</button>
      </div>
      <button id="googleBtn" class="btn google">Continue with Google</button>
      <button id="resetBtn" class="text-btn">Forgot password?</button>
      <p id="authMessage" class="message" role="status"></p>
    </section>
  </div>

  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark small">N</span><span>NEXORA</span></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav id="navigation">
        <button data-page="dashboard" class="nav-item active">◈ <span>Dashboard</span></button>
        <button data-page="transactions" class="nav-item">↗ <span>Transactions</span></button>
        <button data-page="customers" class="nav-item">◎ <span>Customers</span></button>
        <button data-page="suppliers" class="nav-item">⇄ <span>Suppliers</span></button>
        <button data-page="inventory" class="nav-item">▦ <span>Inventory</span></button>
        <button data-page="projects" class="nav-item">▤ <span>Projects</span></button>
        <button data-page="invoices" class="nav-item">▧ <span>Invoices</span></button>
        <button data-page="appointments" class="nav-item">◷ <span>Appointments</span></button>
        <button data-page="team" class="nav-item">♙ <span>Team & Tasks</span></button>
        <button data-page="reports" class="nav-item">▥ <span>Reports</span></button>
        <button data-page="settings" class="nav-item">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="user-mini"><div class="avatar" id="userAvatar">N</div><div><strong id="userName">User</strong><small id="userEmail"></small></div></div>
        <button id="logoutBtn" class="btn logout">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Toggle menu">☰</button>
        <div><p class="eyebrow" id="pageEyebrow">BUSINESS OVERVIEW</p><h2 id="pageTitle">Dashboard</h2></div>
        <div class="top-actions">
          <span id="categoryBadge" class="category-badge">General Business</span>
          <button id="themeBtn" class="icon-btn" title="Toggle theme">◐</button>
        </div>
      </header>
      <section id="pageContent" class="page-content"></section>
      <footer>NEXORA <span id="appVersion">v2.3.0</span> · Business Workspace</footer>
    </main>
  </div>

  <dialog id="recordDialog" class="dialog">
    <form id="recordForm">
      <div class="dialog-head"><h3 id="dialogTitle">New record</h3><button type="button" id="closeDialog" class="icon-btn">✕</button></div>
      <div id="recordFields" class="form-grid"></div>
      <div class="dialog-actions"><button type="button" id="cancelRecord" class="btn">Cancel</button><button class="btn primary" type="submit">Save record</button></div>
      <p id="recordMessage" class="message"></p>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
